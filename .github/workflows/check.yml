name: Beat checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and test
        run: npm run check
      - name: Verify native bundles
        run: npx expo export --platform all --output-dir native-dist
        env:
          EXPO_OFFLINE: '1'
      - name: Build installable sample website
        run: npm run build:pwa
      - name: Validate install and offline assets
        run: npm run check:pwa
      - name: Validate Cloudflare deployment bundle
        run: npm run check:worker
      - name: Upload checked sample website
        uses: actions/upload-artifact@v4
        with:
          name: beat-sample-web
          path: dist/
          retention-days: 7
