name: Beat checks and deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and test
        run: npm run check
      - name: Verify native bundles
        run: npx expo export --platform all --output-dir native-dist
        env:
          EXPO_OFFLINE: '1'
      - name: Build installable sample website
        run: npm run build:pwa
      - name: Validate install and offline assets
        run: npm run check:pwa
      - name: Upload tested website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy tested website
        id: deployment
        uses: actions/deploy-pages@v4
